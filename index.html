<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Alman Usulü</title>
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alman Usulü">
<link rel="manifest" href="icons/manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="shortcut icon" href="icons/favicon.ico">
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e5e7eb;
    --accent:#2563eb; --accent-ink:#fff; --pos:#15803d; --neg:#b91c1c; --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b1220; --card:#131c2e; --ink:#e5e7eb; --muted:#94a3b8; --line:#243044;
           --accent:#3b82f6; --pos:#4ade80; --neg:#f87171; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
  h1{font-size:22px;margin:0;letter-spacing:-.01em}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center}
  h2 button{text-transform:none;letter-spacing:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .row{display:flex;gap:10px;align-items:center}
  .grow{flex:1;min-width:0}
  .muted{color:var(--muted);font-size:14px}
  .brand{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
  .brand img{width:36px;height:36px;border-radius:9px}
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 0 14px}
  .hero img{width:96px;height:96px;border-radius:24px;box-shadow:0 12px 30px rgba(30,58,138,.35)}
  .hero h1{font-size:28px;margin-top:14px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,select,button{font:inherit}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
  button{padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600;width:100%;margin-top:14px}
  button.small{padding:6px 10px;font-size:13px}
  button.link{border:0;background:none;color:var(--accent);padding:4px 6px;font-size:14px}
  button.danger{color:var(--neg)}
  button:disabled{opacity:.5;cursor:default}
  .tabs{display:flex;background:var(--bg);border-radius:10px;padding:4px;gap:4px}
  .tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:600;padding:8px}
  .tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;user-select:none;font-size:14px;background:var(--card)}
  .chip input{display:none}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .chip.static{cursor:default}
  .chip .x{margin-left:2px;opacity:.6}
  .bal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bal .card{padding:12px}
  .bal .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bal .amt{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
  .pos{color:var(--pos)} .neg{color:var(--neg)}
  .settle{display:flex;flex-direction:column;gap:8px}
  .settle .card{padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
  .settle b{font-weight:600}
  .list{display:flex;flex-direction:column;gap:8px}
  .ev{display:flex;align-items:center;gap:12px;cursor:pointer}
  .ev .name{font-weight:600}
  .ev .arrow{color:var(--muted)}
  .exp{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px}
  .exp .date{font-size:12px;color:var(--muted);text-align:center;line-height:1.2}
  .exp .date b{display:block;font-size:17px;color:var(--ink)}
  .exp .desc{font-weight:600}
  .exp .sub{font-size:13px;color:var(--muted)}
  .exp .amt{font-weight:700;text-align:right;white-space:nowrap}
  .exp .amt .mine{display:block;font-size:12px;font-weight:500;color:var(--muted)}
  .exp.payment .desc::before{content:"↔ ";color:var(--muted)}
  .exp .actions{grid-column:1 / -1;display:flex;gap:8px;justify-content:flex-end;align-items:center}
  .shares{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .shares .row{padding:4px 0}
  .shares .row span{flex:1}
  .shares input{width:120px;text-align:right}
  .shares .calc{width:100px;text-align:right;color:var(--muted);font-size:14px}
  .remain{font-size:13px;margin-top:8px;text-align:right}
  .err{color:var(--neg);font-size:14px;margin-top:10px;min-height:1em}
  .empty{color:var(--muted);text-align:center;padding:24px 0}
  .hidden{display:none !important}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  .members{display:flex;flex-direction:column;gap:6px}
  .members .row{padding:6px 0;border-bottom:1px solid var(--line)}
  .members .row:last-child{border:0}
</style>
</head>
<body>
<main>
  <!-- ============ Giriş -->
  <section id="login" class="hidden">
    <div class="hero">
      <img src="icons/logo.svg" alt="">
      <h1>Alman Usulü</h1>
      <p class="muted">Kim ne ödedi, kim kime borçlu — arkadaş defteri.</p>
    </div>
    <form class="card" id="loginForm" autocomplete="on">
      <label for="email">E-posta</label>
      <input id="email" type="email" inputmode="email" autocapitalize="off" required placeholder="ad@gmail.com">
      <label for="pass">Şifre</label>
      <input id="pass" type="password" required>
      <button class="primary" type="submit">Giriş</button>
      <div class="err" id="loginErr"></div>
    </form>
  </section>

  <!-- ============ Etkinlikler -->
  <section id="home" class="hidden">
    <div class="row">
      <div class="brand grow"><img src="icons/logo.svg" alt=""><div><h1>Alman Usulü</h1><div class="muted" id="who"></div></div></div>
      <button class="small" id="logoutBtn">Çıkış</button>
    </div>

    <h2>Etkinlikler</h2>
    <div class="list" id="events"></div>

    <h2>Yeni etkinlik</h2>
    <form class="card" id="newEventForm">
      <label for="evName">Ad</label>
      <input id="evName" type="text" maxlength="60" required placeholder="Cunda tatili, Ev, Kamp…">
      <label>Katılımcılar <span class="muted" id="newCount"></span></label>
      <div class="chips" id="newUsers"></div>
      <div class="row" style="margin-top:10px">
        <input id="newGuest" type="text" maxlength="40" placeholder="Misafir adı (giriş yapmayan biri)" class="grow">
        <button type="button" class="small" id="newGuestAdd">Ekle</button>
      </div>
      <div class="chips" id="newGuests"></div>
      <button class="primary" type="submit">Etkinliği oluştur</button>
      <div class="err" id="newEventErr"></div>
    </form>
  </section>

  <!-- ============ Etkinlik -->
  <section id="event" class="hidden">
    <div class="row">
      <button class="small" id="backBtn">←</button>
      <div class="brand grow"><img src="icons/logo.svg" alt=""><div><h1 id="evTitle"></h1><div class="muted" id="evSub"></div></div></div>
      <button class="small" id="renameBtn" title="Adı değiştir">✎</button>
      <button class="small" id="refreshBtn" title="Yenile">↻</button>
    </div>

    <h2>Durum</h2>
    <div class="bal" id="balances"></div>

    <h2>Kim kime ne verecek</h2>
    <div class="settle" id="settle"></div>

    <h2><span id="formTitle">Yeni kayıt</span><button type="button" class="link hidden" id="cancelEdit">Vazgeç</button></h2>
    <form class="card" id="expForm">
      <div class="tabs" id="kindTabs">
        <button type="button" data-kind="expense" class="on">Harcama</button>
        <button type="button" data-kind="payment">Borç ödemesi</button>
      </div>
      <label for="desc">Açıklama</label>
      <input id="desc" type="text" maxlength="120" required placeholder="Akşam yemeği, market, benzin…">
      <div class="row">
        <div class="grow"><label for="amount">Tutar (₺)</label>
          <input id="amount" type="number" inputmode="decimal" step="0.01" min="0.01" required placeholder="0,00"></div>
        <div class="grow"><label for="date">Tarih</label><input id="date" type="date" required></div>
      </div>
      <label for="payer">Kim ödedi?</label>
      <select id="payer"></select>

      <div id="splitBox">
        <label>Nasıl bölüşülsün?</label>
        <div class="tabs" id="modeTabs">
          <button type="button" data-mode="equal" class="on">Eşit</button>
          <button type="button" data-mode="amount">Tutara göre</button>
          <button type="button" data-mode="shares">Paya göre</button>
        </div>
        <div id="modeEqual">
          <label>Kimler için? <span class="muted" id="splitHint"></span></label>
          <div class="chips" id="split"></div>
        </div>
        <div id="modeAmount" class="hidden">
          <div class="shares" id="amountRows"></div>
          <div class="remain" id="amountRemain"></div>
        </div>
        <div id="modeShares" class="hidden">
          <div class="muted" style="margin-top:6px">Pay sayısı: 0 = dâhil değil, 2 = iki kişilik</div>
          <div class="shares" id="shareRows"></div>
        </div>
      </div>
      <div id="toBox" class="hidden">
        <label for="to">Kime ödendi?</label>
        <select id="to"></select>
      </div>
      <button class="primary" type="submit" id="saveBtn">Kaydet</button>
      <div class="err" id="expErr"></div>
    </form>

    <h2>Kayıtlar <span class="muted" id="count"></span></h2>
    <div class="list" id="list"></div>

    <h2>Katılımcılar <span class="muted" id="memberCount"></span></h2>
    <div class="card">
      <div class="members" id="members"></div>
      <div id="addMember">
        <label>Katılımcı ekle</label>
        <div class="chips" id="addUsers"></div>
        <div class="row" style="margin-top:10px">
          <input id="addGuest" type="text" maxlength="40" placeholder="Misafir adı" class="grow">
          <button type="button" class="small" id="addGuestBtn">Ekle</button>
        </div>
      </div>
      <div class="err" id="memberErr"></div>
    </div>

    <h2>Etkinlik</h2>
    <div class="card row">
      <span class="grow muted">Etkinliği ve tüm kayıtlarını sil</span>
      <button type="button" class="small danger" id="delEventBtn">Sil</button>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
// Supabase (majka-panel projesi). Yayınlanabilir anahtar; koruma sunucudaki
// hesap_* fonksiyonlarında (her çağrı e-posta+şifre doğrular).
const SUPABASE_URL = "https://hixlepniydwuqxenjgrj.supabase.co";
const SUPABASE_KEY = "sb_publishable_nxAwPpSdPHZMkeL0B90bug_xUcXlt8b";
const SESSION_KEY = "alman-usulu:session";
const MAX_P = 10;

const $ = (s) => document.querySelector(s);
const fmt = new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY" });
const money = (n) => fmt.format(n);
const AY = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };

let session = null;   // {email, pass}
let base = null;      // {me, users, events}
let ev = null;        // {id, name, participants, expenses, me}
let kind = "expense", mode = "equal";
let editing = null;   // düzenlenen kaydın id'si
let pendingDelete = null, pendingDeleteEvent = false;
let newGuests = [];

async function rpc(fn, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
    body: JSON.stringify({ p_email: session.email, p_pass: session.pass, ...args }),
  });
  const body = await r.json().catch(() => null);
  if (!r.ok) throw new Error(body?.message || body?.hint || `Hata (${r.status})`);
  return body;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}
function show(id) { for (const s of ["login", "home", "event"]) $("#" + s).classList.toggle("hidden", s !== id); }

// ---------------------------------------------------------------- oturum
function loadSession() { try { session = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { session = null; } }
function saveSession() { try { session ? localStorage.setItem(SESSION_KEY, JSON.stringify(session)) : localStorage.removeItem(SESSION_KEY); } catch {} }

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#loginErr").textContent = "";
  const btn = e.target.querySelector("button"); btn.disabled = true;
  try {
    session = { email: $("#email").value.trim().toLowerCase(), pass: $("#pass").value };
    await loadHome();
    saveSession();
    route();
  } catch (err) { session = null; $("#loginErr").textContent = err.message; }
  finally { btn.disabled = false; }
});
$("#logoutBtn").addEventListener("click", () => {
  session = null; base = null; ev = null; saveSession();
  $("#pass").value = ""; location.hash = ""; show("login");
});

// ---------------------------------------------------------------- yönlendirme
function route() {
  if (!session) { show("login"); return; }
  const m = location.hash.match(/^#e\/([0-9a-f-]{36})$/);
  if (m) openEvent(m[1]); else { loadHome().then(renderHome).catch(e => toast(e.message)); show("home"); }
}
window.addEventListener("hashchange", route);
$("#backBtn").addEventListener("click", () => { location.hash = ""; });
$("#refreshBtn").addEventListener("click", () => loadEvent().then(renderEvent).catch(e => toast(e.message)));
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !session) return;
  (ev ? loadEvent().then(renderEvent) : loadHome().then(renderHome)).catch(() => {});
});

// ---------------------------------------------------------------- ana sayfa
async function loadHome() { base = await rpc("hesap_get", {}); }
const uname = (email) => base.users.find(u => u.email === email)?.name || email;

function renderHome() {
  if (!base) return;
  $("#who").textContent = `${uname(base.me)} olarak giriş yapıldı`;
  $("#events").innerHTML = base.events.length ? base.events.map(e => `
    <div class="card ev" data-open="${e.id}">
      <div class="grow"><div class="name">${esc(e.name)}</div>
        <div class="muted">${e.participant_count} kişi · ${e.expense_count} kayıt${Number(e.total) ? " · " + money(Number(e.total)) : ""}</div></div>
      <span class="arrow">›</span></div>`).join("")
    : `<div class="empty">Henüz etkinlik yok. Aşağıdan bir tane oluştur.</div>`;
  if (!$("#newUsers").children.length) {
    $("#newUsers").innerHTML = base.users.map(u =>
      `<label class="chip on"><input type="checkbox" value="${u.email}" checked>${esc(u.name)}</label>`).join("");
  }
  renderNewGuests();
}
$("#events").addEventListener("click", (e) => { const c = e.target.closest("[data-open]"); if (c) location.hash = "#e/" + c.dataset.open; });
$("#newUsers").addEventListener("change", (e) => { e.target.closest(".chip").classList.toggle("on", e.target.checked); renderNewGuests(); });
function newParticipants() {
  const users = [...$("#newUsers").querySelectorAll("input:checked")].map(i => ({ name: uname(i.value), email: i.value }));
  return users.concat(newGuests.map(n => ({ name: n })));
}
function renderNewGuests() {
  $("#newGuests").innerHTML = newGuests.map((n, i) => `<span class="chip static">${esc(n)}<button type="button" class="link x" data-rm="${i}">✕</button></span>`).join("");
  $("#newCount").textContent = `(${newParticipants().length}/${MAX_P})`;
}
$("#newGuests").addEventListener("click", (e) => { const b = e.target.closest("[data-rm]"); if (b) { newGuests.splice(+b.dataset.rm, 1); renderNewGuests(); } });
$("#newGuestAdd").addEventListener("click", () => {
  const n = $("#newGuest").value.trim(); if (!n) return;
  if (newParticipants().length >= MAX_P) { $("#newEventErr").textContent = `En fazla ${MAX_P} katılımcı.`; return; }
  if (newParticipants().some(p => p.name.toLowerCase() === n.toLowerCase())) { $("#newEventErr").textContent = "Bu ad zaten var."; return; }
  newGuests.push(n); $("#newGuest").value = ""; $("#newEventErr").textContent = ""; renderNewGuests();
});
$("#newGuest").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $("#newGuestAdd").click(); } });
$("#newEventForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#newEventErr").textContent = "";
  const ps = newParticipants();
  if (!ps.length) { $("#newEventErr").textContent = "En az bir katılımcı seç."; return; }
  if (ps.length > MAX_P) { $("#newEventErr").textContent = `En fazla ${MAX_P} katılımcı.`; return; }
  const btn = e.target.querySelector("button.primary"); btn.disabled = true;
  try {
    const id = await rpc("hesap_create_event", { p_name: $("#evName").value.trim(), p_participants: ps });
    $("#evName").value = ""; newGuests = [];
    location.hash = "#e/" + id;
  } catch (err) { $("#newEventErr").textContent = err.message; }
  finally { btn.disabled = false; }
});

// ---------------------------------------------------------------- etkinlik
async function openEvent(id) {
  if (!base) await loadHome().catch(() => {});
  ev = { id };
  editing = null; pendingDelete = null; pendingDeleteEvent = false;
  try { await loadEvent(); } catch (err) { toast(err.message); location.hash = ""; return; }
  resetForm();
  renderEvent();
  show("event");
  window.scrollTo(0, 0);
}
async function loadEvent() { const d = await rpc("hesap_event", { p_event: ev.id }); ev = d; }
const P = (id) => ev.participants.find(p => p.id === id);
const pname = (id) => P(id)?.name || "?";
const meP = () => ev.participants.find(p => p.email === ev.me);

function balances() {
  // kuruş cinsinden; + alacaklı, − borçlu
  const b = Object.fromEntries(ev.participants.map(p => [p.id, 0]));
  for (const e of ev.expenses) {
    b[e.payer] = (b[e.payer] || 0) + Math.round(Number(e.amount) * 100);
    for (const s of e.shares) b[s.p] = (b[s.p] || 0) - Math.round(Number(s.amount) * 100);
  }
  return b;
}
function settlements(b) {
  const debt = Object.entries(b).filter(([, v]) => v < 0).map(([k, v]) => [k, -v]).sort((a, c) => c[1] - a[1]);
  const cred = Object.entries(b).filter(([, v]) => v > 0).sort((a, c) => c[1] - a[1]);
  const out = []; let i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    const x = Math.min(debt[i][1], cred[j][1]);
    if (x > 0) out.push({ from: debt[i][0], to: cred[j][0], amount: x });
    debt[i][1] -= x; cred[j][1] -= x;
    if (debt[i][1] === 0) i++;
    if (cred[j][1] === 0) j++;
  }
  return out;
}

function renderEvent() {
  if (!ev || !ev.participants) return;
  const me = meP();
  $("#evTitle").textContent = ev.name;
  $("#evSub").textContent = `${ev.participants.length} kişi · ${uname(ev.me)} olarak`;

  const b = balances();
  $("#balances").innerHTML = ev.participants.map(p => {
    const v = (b[p.id] || 0) / 100;
    const cls = v > 0 ? "pos" : v < 0 ? "neg" : "";
    const txt = v > 0 ? "alacaklı" : v < 0 ? "borçlu" : "ödeşmiş";
    return `<div class="card"><div class="name">${esc(p.name)}${p.id === me?.id ? ' <span class="muted">(sen)</span>' : ""}</div>
      <div class="amt ${cls}">${money(Math.abs(v))}</div><div class="muted">${txt}</div></div>`;
  }).join("");

  const s = settlements(b);
  $("#settle").innerHTML = s.length
    ? s.map(t => `<div class="card"><span><b>${esc(pname(t.from))}</b> → <b>${esc(pname(t.to))}</b></span><b>${money(t.amount / 100)}</b></div>`).join("")
    : `<div class="empty">Herkes ödeşmiş 🎉</div>`;

  renderFormOptions();

  $("#count").textContent = ev.expenses.length ? `(${ev.expenses.length})` : "";
  $("#list").innerHTML = ev.expenses.length ? ev.expenses.map(e => {
    const d = new Date(e.spent_on + "T00:00:00");
    const amt = Number(e.amount);
    const myShare = me ? Number(e.shares.find(s => s.p === me.id)?.amount || 0) : 0;
    let mine = "";
    if (e.kind === "payment") mine = me && e.payer === me.id ? "sen ödedin" : me && e.shares[0]?.p === me.id ? "sana ödendi" : "";
    else if (me && e.payer === me.id) mine = `senin alacağın ${money(amt - myShare)}`;
    else if (myShare) mine = `senin payın ${money(myShare)}`;
    const everyone = e.shares.length === ev.participants.length && e.split_mode === "equal";
    const sub = e.kind === "payment"
      ? `${esc(pname(e.payer))} → ${esc(pname(e.shares[0]?.p))}`
      : `${esc(pname(e.payer))} ödedi · ${everyone ? "herkes eşit" : e.shares.map(s => `${esc(pname(s.p))} ${money(Number(s.amount))}`).join(", ")}`;
    const actions = pendingDelete === e.id
      ? `<span class="muted">Silinsin mi?</span><button type="button" class="small" data-cancel>Vazgeç</button><button type="button" class="small danger" data-confirm="${e.id}">Evet, sil</button>`
      : `<button type="button" class="small" data-edit="${e.id}">Düzenle</button><button type="button" class="small" data-del="${e.id}">Sil</button>`;
    return `<div class="card exp ${e.kind}">
      <div class="date"><b>${d.getDate()}</b>${AY[d.getMonth()]}</div>
      <div><div class="desc">${esc(e.description)}</div><div class="sub">${sub}${e.updated_at ? " · düzenlendi" : ""}</div></div>
      <div class="amt">${money(amt)}<span class="mine">${mine}</span></div>
      <div class="actions">${actions}</div></div>`;
  }).join("") : `<div class="empty">Henüz kayıt yok. İlk harcamayı ekle.</div>`;

  // katılımcılar
  $("#memberCount").textContent = `(${ev.participants.length}/${MAX_P})`;
  $("#members").innerHTML = ev.participants.map(p => `<div class="row"><span class="grow">${esc(p.name)}${p.email ? ` <span class="muted">${esc(p.email)}</span>` : ' <span class="muted">misafir</span>'}</span>
    <button type="button" class="small" data-rmp="${p.id}">Çıkar</button></div>`).join("");
  const full = ev.participants.length >= MAX_P;
  $("#addMember").classList.toggle("hidden", full);
  $("#memberErr").textContent = full ? `Katılımcı sınırı (${MAX_P}) doldu.` : "";
  const inEv = new Set(ev.participants.map(p => p.email).filter(Boolean));
  $("#addUsers").innerHTML = base.users.filter(u => !inEv.has(u.email)).map(u =>
    `<button type="button" class="chip" data-addu="${u.email}">+ ${esc(u.name)}</button>`).join("") || `<span class="muted">Tüm hesaplar ekli; misafir ekleyebilirsin.</span>`;

  $("#delEventBtn").textContent = pendingDeleteEvent ? "Evet, hepsini sil" : "Sil";
}

$("#list").addEventListener("click", async (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.edit) { startEdit(t.dataset.edit); return; }
  if (t.dataset.del) { pendingDelete = t.dataset.del; renderEvent(); return; }
  if (t.hasAttribute("data-cancel")) { pendingDelete = null; renderEvent(); return; }
  if (t.dataset.confirm) {
    t.disabled = true;
    try {
      await rpc("hesap_delete_expense", { p_expense: t.dataset.confirm });
      pendingDelete = null; if (editing === t.dataset.confirm) resetForm();
      toast("Silindi"); await loadEvent(); renderEvent();
    } catch (err) { toast(err.message); t.disabled = false; }
  }
});

// katılımcı ekle/çıkar, ad değiştir, etkinlik sil
$("#addUsers").addEventListener("click", (e) => { const b = e.target.closest("[data-addu]"); if (b) addParticipant(uname(b.dataset.addu), b.dataset.addu); });
$("#addGuestBtn").addEventListener("click", () => { const n = $("#addGuest").value.trim(); if (n) addParticipant(n, null); });
$("#addGuest").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $("#addGuestBtn").click(); } });
async function addParticipant(name, email) {
  $("#memberErr").textContent = "";
  try {
    await rpc("hesap_add_participant", { p_event: ev.id, p_name: name, p_user_email: email });
    $("#addGuest").value = ""; toast(`${name} eklendi`); await loadEvent(); renderFormOptions(true); renderEvent();
  } catch (err) { $("#memberErr").textContent = err.message.includes("unique") ? "Bu ad zaten var." : err.message; }
}
$("#members").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-rmp]"); if (!b) return;
  $("#memberErr").textContent = "";
  try {
    await rpc("hesap_remove_participant", { p_event: ev.id, p_participant: b.dataset.rmp });
    toast("Çıkarıldı"); await loadEvent(); renderFormOptions(true); renderEvent();
  } catch (err) { $("#memberErr").textContent = err.message; }
});
$("#renameBtn").addEventListener("click", async () => {
  const n = prompt("Etkinliğin yeni adı", ev.name); if (!n || !n.trim() || n.trim() === ev.name) return;
  try { await rpc("hesap_rename_event", { p_event: ev.id, p_name: n.trim() }); await loadEvent(); renderEvent(); } catch (err) { toast(err.message); }
});
$("#delEventBtn").addEventListener("click", async () => {
  if (!pendingDeleteEvent) { pendingDeleteEvent = true; renderEvent(); setTimeout(() => { pendingDeleteEvent = false; if (ev) renderEvent(); }, 5000); return; }
  try { await rpc("hesap_delete_event", { p_event: ev.id }); toast("Etkinlik silindi"); ev = null; location.hash = ""; } catch (err) { toast(err.message); }
});

// ---------------------------------------------------------------- kayıt formu
function renderFormOptions(force) {
  const sel = $("#payer");
  if (force || sel.dataset.ev !== ev.id || sel.options.length !== ev.participants.length) {
    const cur = sel.value, curTo = $("#to").value;
    const opts = ev.participants.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
    sel.innerHTML = opts; sel.dataset.ev = ev.id;
    sel.value = ev.participants.some(p => p.id === cur) ? cur : (meP()?.id || ev.participants[0].id);
    $("#to").innerHTML = opts; if (ev.participants.some(p => p.id === curTo)) $("#to").value = curTo;
    const checked = new Set(selectedSplit());
    $("#split").innerHTML = ev.participants.map(p => {
      const on = force && checked.size ? checked.has(p.id) : true;
      return `<label class="chip ${on ? "on" : ""}"><input type="checkbox" value="${p.id}" ${on ? "checked" : ""}>${esc(p.name)}</label>`; }).join("");
    $("#amountRows").innerHTML = ev.participants.map(p => `<div class="row"><span>${esc(p.name)}</span><input type="number" inputmode="decimal" step="0.01" min="0" data-amt="${p.id}" placeholder="0,00"></div>`).join("");
    $("#shareRows").innerHTML = ev.participants.map(p => `<div class="row"><span>${esc(p.name)}</span><span class="calc" data-calc="${p.id}"></span><input type="number" inputmode="numeric" step="1" min="0" data-w="${p.id}" value="1"></div>`).join("");
    syncTo();
  }
  updateHints();
}
function selectedSplit() { return [...$("#split").querySelectorAll("input:checked")].map(i => i.value); }
function cents(v) { return Math.round((Number(v) || 0) * 100); }
function equalSplit(total, ids) {
  const n = ids.length, basec = Math.floor(total / n); let rest = total - basec * n;
  return ids.map(p => { const a = basec + (rest > 0 ? 1 : 0); if (rest > 0) rest--; return { p, amount: a / 100, w: 1 }; });
}
function weightedSplit(total, ws) {
  // ws: [{p,w}], w>0; kalan kuruşlar en büyük paylardan başlayarak dağıtılır
  const W = ws.reduce((s, x) => s + x.w, 0);
  const raw = ws.map(x => ({ p: x.p, w: x.w, exact: total * x.w / W }));
  raw.forEach(x => { x.c = Math.floor(x.exact); x.frac = x.exact - x.c; });
  let rest = total - raw.reduce((s, x) => s + x.c, 0);
  [...raw].sort((a, b) => b.frac - a.frac).forEach(x => { if (rest > 0) { x.c++; rest--; } });
  return raw.map(x => ({ p: x.p, amount: x.c / 100, w: x.w }));
}
function currentShares() {
  const total = cents($("#amount").value);
  if (kind === "payment") return [{ p: $("#to").value, amount: total / 100, w: 1 }];
  if (mode === "equal") { const ids = selectedSplit(); return ids.length ? equalSplit(total, ids) : []; }
  if (mode === "amount") return [...$("#amountRows").querySelectorAll("[data-amt]")].map(i => ({ p: i.dataset.amt, amount: cents(i.value) / 100, w: 1 })).filter(s => s.amount > 0);
  const ws = [...$("#shareRows").querySelectorAll("[data-w]")].map(i => ({ p: i.dataset.w, w: Math.max(0, Math.floor(Number(i.value) || 0)) })).filter(x => x.w > 0);
  return ws.length ? weightedSplit(total, ws) : [];
}
function updateHints() {
  const total = cents($("#amount").value);
  const n = selectedSplit().length;
  $("#splitHint").textContent = n && total > 0 ? `· kişi başı ${money(total / n / 100)}` : "";
  if (mode === "amount") {
    const sum = [...$("#amountRows").querySelectorAll("[data-amt]")].reduce((s, i) => s + cents(i.value), 0);
    const diff = total - sum;
    $("#amountRemain").innerHTML = diff === 0 && total > 0 ? `<span class="pos">Tamam, paylar tutara eşit</span>`
      : diff > 0 ? `Dağıtılmamış: <b>${money(diff / 100)}</b>` : `<span class="neg">Fazla: ${money(-diff / 100)}</span>`;
  }
  if (mode === "shares") {
    const sh = currentShares();
    $("#shareRows").querySelectorAll("[data-calc]").forEach(el => { const s = sh.find(x => x.p === el.dataset.calc); el.textContent = s ? money(s.amount) : "—"; });
  }
}
function syncTo() {
  const payer = $("#payer").value;
  [...$("#to").options].forEach(o => { o.disabled = o.value === payer; });
  if ($("#to").value === payer) $("#to").value = ev.participants.find(p => p.id !== payer)?.id || "";
}
function setKind(k) {
  kind = k;
  $("#kindTabs").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.kind === k));
  const pay = k === "payment";
  $("#splitBox").classList.toggle("hidden", pay);
  $("#toBox").classList.toggle("hidden", !pay);
  $("#desc").placeholder = pay ? "Borç ödemesi" : "Akşam yemeği, market, benzin…";
  $("#desc").required = !pay;
}
function setMode(m) {
  mode = m;
  $("#modeTabs").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  $("#modeEqual").classList.toggle("hidden", m !== "equal");
  $("#modeAmount").classList.toggle("hidden", m !== "amount");
  $("#modeShares").classList.toggle("hidden", m !== "shares");
  updateHints();
}
$("#kindTabs").addEventListener("click", (e) => { const b = e.target.closest("[data-kind]"); if (b) setKind(b.dataset.kind); });
$("#modeTabs").addEventListener("click", (e) => { const b = e.target.closest("[data-mode]"); if (b) setMode(b.dataset.mode); });
$("#split").addEventListener("change", (e) => { e.target.closest(".chip").classList.toggle("on", e.target.checked); updateHints(); });
$("#amount").addEventListener("input", updateHints);
$("#amountRows").addEventListener("input", updateHints);
$("#shareRows").addEventListener("input", updateHints);
$("#payer").addEventListener("change", syncTo);

function resetForm() {
  editing = null;
  $("#formTitle").textContent = "Yeni kayıt"; $("#cancelEdit").classList.add("hidden");
  $("#saveBtn").textContent = "Kaydet"; $("#expErr").textContent = "";
  $("#desc").value = ""; $("#amount").value = ""; $("#date").value = today();
  setKind("expense"); setMode("equal");
  if (ev?.participants) {
    renderFormOptions(true);
    $("#split").querySelectorAll("input").forEach(i => { i.checked = true; i.closest(".chip").classList.add("on"); });
    $("#amountRows").querySelectorAll("input").forEach(i => i.value = "");
    $("#shareRows").querySelectorAll("input").forEach(i => i.value = "1");
    $("#payer").value = meP()?.id || ev.participants[0].id; syncTo();
  }
  updateHints();
}
function startEdit(id) {
  const e = ev.expenses.find(x => x.id === id); if (!e) return;
  resetForm();
  editing = id;
  $("#formTitle").textContent = "Kaydı düzenle"; $("#cancelEdit").classList.remove("hidden");
  $("#saveBtn").textContent = "Değişiklikleri kaydet";
  $("#desc").value = e.description; $("#amount").value = Number(e.amount); $("#date").value = e.spent_on;
  $("#payer").value = e.payer; syncTo();
  setKind(e.kind);
  if (e.kind === "payment") { $("#to").value = e.shares[0]?.p; }
  else {
    setMode(e.split_mode);
    const inS = new Set(e.shares.map(s => s.p));
    $("#split").querySelectorAll("input").forEach(i => { i.checked = inS.has(i.value); i.closest(".chip").classList.toggle("on", i.checked); });
    $("#amountRows").querySelectorAll("[data-amt]").forEach(i => { const s = e.shares.find(x => x.p === i.dataset.amt); i.value = s ? Number(s.amount) : ""; });
    $("#shareRows").querySelectorAll("[data-w]").forEach(i => { const s = e.shares.find(x => x.p === i.dataset.w); i.value = s ? (s.w ?? 1) : 0; });
  }
  updateHints();
  $("#expForm").scrollIntoView({ behavior: "smooth", block: "start" });
}
$("#cancelEdit").addEventListener("click", resetForm);

$("#expForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#expErr").textContent = "";
  const total = cents($("#amount").value);
  if (total <= 0) { $("#expErr").textContent = "Tutar gir."; return; }
  const shares = currentShares();
  if (!shares.length) { $("#expErr").textContent = "En az bir kişi seç."; return; }
  const sum = shares.reduce((s, x) => s + cents(x.amount), 0);
  if (sum !== total) { $("#expErr").textContent = `Paylar toplamı (${money(sum / 100)}) tutara (${money(total / 100)}) eşit değil.`; return; }
  const btn = $("#saveBtn"); btn.disabled = true;
  try {
    await rpc("hesap_save_expense", {
      p_id: editing, p_event: ev.id, p_kind: kind, p_payer: $("#payer").value,
      p_amount: total / 100, p_description: $("#desc").value.trim() || "Borç ödemesi",
      p_spent_on: $("#date").value, p_split_mode: kind === "payment" ? "equal" : mode, p_shares: shares,
    });
    toast(editing ? "Güncellendi" : "Kaydedildi");
    const wasEdit = !!editing;
    resetForm();
    await loadEvent(); renderEvent();
    if (wasEdit) $("#list").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (err) { $("#expErr").textContent = err.message; }
  finally { btn.disabled = false; }
});

// ---------------------------------------------------------------- başlat
loadSession();
if (session) {
  loadHome().then(route).catch(() => { session = null; saveSession(); show("login"); });
} else show("login");
</script>
